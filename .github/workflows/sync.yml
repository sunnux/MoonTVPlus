name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时同步一次
  workflow_dispatch:        # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: tgymnich/fork-sync@v2
        with:
          owner: mtvpls
          repo: MoonTVPlus
          base: main         # 上游分支
          head: main         # 你的 Fork 分支
