name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: tgymnich/fork-sync@v2
        with:
          owner: mtvpls
          repo: MoonTVPlus
          base: main
          head: main
          token: ${{ secrets.GITHUB_TOKEN }}
